<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transferencia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        form {
            display: inline-block;
            text-align: left;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
        <script>
        function realizarTransferencia(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            
            fetch('/transfer', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error);
                    });
                }
                alert('Transferencia realizada con éxito');
                window.location.href = '/';
                return response.json();
            })
            .catch(error => {
                alert(error.message || 'Error al realizar la transferencia');
            });
        }
    </script>
<body>
        <h2>Realizar Transferencia</h2>
            <form onsubmit="realizarTransferencia(event)">
                <div>
                    <label>ID Emisor:</label>
                    <input type="number" name="id_emisor" required>
                </div>
                <div>
                    <label>ID Receptor:</label>
                    <input type="number" name="id_receptor" required>
                </div>
                <div>
                    <label>Valor:</label>
                    <input type="number" step="0.01" name="valor" required>
                </div>
                <button type="submit">Transferir</button>
            </form>
            <p><a href="/">Volver al inicio</a></p>

</body>
</html>
