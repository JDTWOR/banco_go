<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transferencia</title>
</head>
<body>
    <h1>Realizar Transferencia</h1>
    <form action="/transfer" method="post">
        <label for="id_emisor">ID Emisor:</label>
        <input type="number" id="id_emisor" name="id_emisor" required><br><br>
        <label for="id_receptor">ID Receptor:</label>
        <input type="number" id="id_receptor" name="id_receptor" required><br><br>
        <label for="valor">Valor:</label>
        <input type="number" step="0.01" id="valor" name="valor" required><br><br>
        <button type="submit">Transferir</button>
    </form>
</body>
</html>
