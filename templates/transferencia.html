<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transferencia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        form {
            display: inline-block;
            text-align: left;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin-left: 10px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <h1>Realizar Transferencia</h1>
    <form action="/transfer" method="post">
        <label for="id_emisor">Emisor:</label>
        <select id="id_emisor" name="id_emisor" required>
            {{range .Users}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
        </select><br><br>
        <label for="id_receptor">Receptor:</label>
        <select id="id_receptor" name="id_receptor" required>
            {{range .Users}}
            <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
        </select><br><br>
        <label for="valor">Valor:</label>
        <input type="number" step="0.01" id="valor" name="valor" required><br><br>
        <button type="submit">Transferir</button>
        <a href="/" class="btn btn-secondary">Volver al Inicio</a>
    </form>
</body>
</html>
