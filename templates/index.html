<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios en Go</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Lista de Usuarios</h1>

        <!-- Formulario para agregar usuario -->
        <form action="/add" method="post" class="mb-4">
            <div class="row g-2 align-items-center">
                <div class="col-md">
                    <input type="text" name="name" placeholder="Nombre" class="form-control" required>
                </div>
                <div class="col-md">
                    <input type="email" name="email" placeholder="Correo" class="form-control" required>
                </div>
                <div class="col-md-auto">
                    <button type="submit" class="btn btn-primary">Agregar</button>
                </div>
            </div>
        </form>

        <div class="mb-4">
            <a href="/transferencia" class="btn btn-success me-2">Transacción</a>
            <a href="/historial" class="btn btn-success">Historial de Transferencias</a>
        </div>

        <!-- Mensaje de confirmación -->
        {{if .Message}}
        <div class="alert alert-success" role="alert">
            {{.Message}}
        </div>
        {{end}}

        <h2>Usuarios registrados:</h2>

        <!-- Tabla de usuarios -->
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Saldo</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Users}}
                    <tr>
                        <td>{{.ID}}</td>
                        <td>
                            <form action="/edit" method="post" class="d-flex align-items-center gap-2">
                                <input type="hidden" name="id" value="{{.ID}}">
                                <input type="text" name="name" value="{{.Name}}" class="form-control form-control-sm" required>
                        </td>
                        <td>
                                <input type="email" name="email" value="{{.Email}}" class="form-control form-control-sm" required>
                        </td>
                        <td>${{printf "%.2f" .Saldo}}</td>
                        <td>
                                <button type="submit" class="btn btn-warning btn-sm">Editar</button>
                            </form>
                            <a href="/delete?id={{.ID}}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Estás seguro de eliminar este usuario?')">Eliminar</a>
                        </td>
                    </tr>
                    {{else}}
                    <tr>
                        <td colspan="5" class="text-center">No hay usuarios aún.</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
